<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  <g filter="url(#glow)">
    <!-- Main Paw Pad -->
    <ellipse cx="50" cy="62" rx="18" ry="14" fill="#ffffff" />
    <!-- 4 Toe Pads -->
    <circle cx="28" cy="42" r="7" fill="#ffffff" />
    <circle cx="43" cy="32" r="7.5" fill="#ffffff" />
    <circle cx="57" cy="32" r="7.5" fill="#ffffff" />
    <circle cx="72" cy="42" r="7" fill="#ffffff" />
    <!-- Leaf accent representing Sanctuary -->
    <path d="M 68 22 C 78 16, 84 24, 78 30 C 72 30, 68 26, 68 22 Z" fill="#a7f3d0" />
  </g>
</svg>
